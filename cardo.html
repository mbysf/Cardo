const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let resolveUid;
const uidReady = new Promise((resolve) => {
  resolveUid = resolve;
});
onAuthStateChanged(auth, (user) => {
  if (user) resolveUid(user.uid);
});
signInAnonymously(auth).catch((e) => console.error("Anonymous sign-in failed:", e));
async function loadRoom(code) {
  try {
    const snap = await getDoc(doc(db, "rooms", code));
    return snap.exists() ? JSON.parse(snap.data().value) : null;
  } catch {
    return null;
  }
}
async function saveRoom(code, data) {
  try {
    await setDoc(doc(db, "rooms", code), { value: JSON.stringify(data), updatedAt: Date.now() });
  } catch {
  }
}
function subscribeRoom(code, callback) {
  return onSnapshot(
    doc(db, "rooms", code),
    (snap) => callback(snap.exists() ? JSON.parse(snap.data().value) : null),
    (err) => console.error("Room subscription error:", err)
  );
}
async function loadProfile() {
  try {
    const uid = await uidReady;
    const snap = await getDoc(doc(db, "profiles", uid));
    return snap.exists() ? JSON.parse(snap.data().value) : null;
  } catch {
    return null;
  }
}
async function saveProfile(p) {
  try {
    const uid = await uidReady;

}
